<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#1a1a1a"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Barbell Icon -->
  <!-- Left Weight Plate -->
  <circle cx="48" cy="96" r="28" fill="url(#grad)"/>
  <circle cx="48" cy="96" r="24" fill="#1e40af" opacity="0.4"/>
  
  <!-- Center Bar -->
  <rect x="76" y="88" width="40" height="16" rx="8" fill="#f0f0f0"/>
  
  <!-- Right Weight Plate -->
  <circle cx="144" cy="96" r="28" fill="url(#grad)"/>
  <circle cx="144" cy="96" r="24" fill="#1e40af" opacity="0.4"/>
  
  <!-- Progress Lines (representing progression/growth) -->
  <line x1="60" y1="50" x2="80" y2="50" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="65" x2="90" y2="65" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="50" x2="132" y2="50" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <line x1="102" y1="65" x2="142" y2="65" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Check mark (representing progress/completion) -->
  <path d="M 60 130 L 70 140 L 90 120" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
